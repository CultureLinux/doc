name: Deploy Prod

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-24.04
    env:
      DEPLOY_PATH: /home/hosting/clinuxdoc/doc
    steps:
      - name: Configure SSH
        run: |
          test -n "$SSH_HOST" || { echo "SSH_HOST is not configured"; exit 1; }
          test -n "$SSH_USER" || { echo "SSH_USER is not configured"; exit 1; }
          test -n "$SSH_KEY" || { echo "SSH_PRIVATE_KEY is not configured"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging.key
          chmod 600 ~/.ssh/staging.key
          cat > ~/.ssh/config <<END
          Host production
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/staging.key
            IdentitiesOnly yes
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
      - name: Check SSH access
        run: ssh production "echo 'SSH OK' && test -d '$DEPLOY_PATH'"
      - name: Pull new changes
        run: ssh production "cd '$DEPLOY_PATH' && git pull --ff-only"
      - name: Install dependencies
        run: ssh production "cd '$DEPLOY_PATH' && . venv/bin/activate && pip install -r requirements.txt"
      - name: Rebuild site
        run: ssh production "cd '$DEPLOY_PATH' && . venv/bin/activate && zensical build --clean --strict"
