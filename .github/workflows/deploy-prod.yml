name: Deploy Prod

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-24.04
    env:
      DEPLOY_PATH: /home/hosting/clinuxdoc/doc
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/production.key
          chmod 600 ~/.ssh/production.key
          cat >>~/.ssh/config <<END
          Host production
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/production.key
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
      - name: Check SSH access
        run: ssh production "echo 'SSH OK' && test -d '$DEPLOY_PATH'"
      - name: Pull new changes
        run: ssh production "cd '$DEPLOY_PATH' && git pull --ff-only"
      - name: Install dependencies
        run: ssh production "cd '$DEPLOY_PATH' && . venv/bin/activate && pip install -r requirements.txt"
      - name: Rebuild site
        run: ssh production "cd '$DEPLOY_PATH' && . venv/bin/activate && mkdocs build --clean --strict"
